name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write
  packages: write
  id-token: write

env:
  MODULE_URL: oci://ghcr.io/${{ github.repository_owner }}/modules/tsbridge

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: stefanprodan/timoni/actions/setup@9f04f5c56a817024dce3f23bdbf8da4516fbe990 # v0.36.0

      - name: Log in to ghcr.io
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GH_TOKEN}" | timoni registry login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Push module (release)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          timoni mod push ./modules/tsbridge "${MODULE_URL,,}" \
            --version "${GITHUB_REF_NAME}" --latest \
            -a 'org.opencontainers.image.licenses=MPL-2.0' \
            -a "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --sign=cosign

      - name: Push module (prerelease)
        if: ${{ contains(github.ref_name, '-') }}
        run: |
          timoni mod push ./modules/tsbridge "${MODULE_URL,,}" \
            --version "${GITHUB_REF_NAME}" --latest=false \
            -a 'org.opencontainers.image.licenses=MPL-2.0' \
            -a "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --sign=cosign

      - name: Create GitHub release
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes

      - name: Create GitHub prerelease
        if: ${{ contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --prerelease
